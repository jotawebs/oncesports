name: Actualizar Tasa Oficial BCV

on:
  schedule:
    # Lunes a Viernes a las 9:00 AM y 5:00 PM hora de Caracas (UTC 13:00 y 21:00)
    - cron: '0 13,21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: windows-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Ejecutar script de actualización BCV
        run: |
          powershell -ExecutionPolicy Bypass -File ./bcv-exchange-rate/update_bcv_rate.ps1 -OutputDir .
          Copy-Item -Path ./bcv_rates.json -Destination ./public/bcv_rates.json -Force
          Copy-Item -Path ./bcv_rates.json -Destination ./bcv-exchange-rate/bcv_rates.json -Force

      - name: Commit y push de la nueva tasa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bcv_rates.json public/bcv_rates.json bcv-exchange-rate/bcv_rates.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bcv): actualizar tasa oficial del BCV" && git push)
